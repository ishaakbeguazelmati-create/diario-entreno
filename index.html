<style>
/* Layout: una columna estrecha de móvil, cabecera con la fecha, contenido por pestañas y barra de navegación fija abajo. */
:root{
  --bg:#0f0e0c; --surface:#181714; --surface2:#211f1b; --line:#2e2b25;
  --fg:#f2eee6; --muted:#a39d90; --gold:#d9ac3f; --gold-ink:#17130a;
  --up:#46c07a; --down:#ee6a5f; --same:#8d877b;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f3ec; --surface:#ffffff; --surface2:#efebe1; --line:#ddd6c6;
    --fg:#1d1a14; --muted:#6c6558; --gold:#9a7410; --gold-ink:#ffffff;
    --up:#1f8a4c; --down:#c63d33; --same:#7a7467; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f3ec; --surface:#ffffff; --surface2:#efebe1; --line:#ddd6c6;
  --fg:#1d1a14; --muted:#6c6558; --gold:#9a7410; --gold-ink:#ffffff;
  --up:#1f8a4c; --down:#c63d33; --same:#7a7467; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
.top{padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:32px;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:14px;margin-top:4px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
.sync.err{color:var(--down)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 8px}
.dchip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dchip .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dchip .n{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.dchip.sel{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.dchip.sel .l{color:var(--gold-ink);opacity:.75}
.dchip.today:not(.sel){border-color:var(--gold)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--muted);background:transparent}
.dot.on{background:var(--up);border-color:var(--up)}
.dot.part{background:var(--gold);border-color:var(--gold)}
.dot.tr{border-radius:1px}
.dchip.sel .dot{border-color:var(--gold-ink)}
.dchip.sel .dot.on,.dchip.sel .dot.part{background:var(--gold-ink)}
.sec{margin-top:22px}
.sec>h2{font-size:22px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec>h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.done{border-color:var(--up)}
.card.other{border-color:var(--gold)}
.card h3{font-size:19px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card p{margin:6px 0 0;color:var(--fg)}
.muted{color:var(--muted)}
.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px 10px;font-weight:600;min-height:44px}
.btn.ok.on{background:var(--up);border-color:var(--up);color:#06150c}
.btn.no.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);width:100%}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=date],textarea,.num{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;font:inherit;min-height:44px}
textarea{resize:vertical;min-height:84px}
.note{margin-top:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.check:first-of-type{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--up);border-color:var(--up)}
.check.on .box::after{content:"";width:6px;height:12px;border:solid #06150c;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{flex:1;min-width:0}
.check .t b{font-weight:600}
.check .t span{display:block;color:var(--muted);font-size:13px}
.group{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:14px 0 2px}
.group:first-child{margin-top:0}
/* entreno */
.ex{padding:14px 12px}
.exh{display:flex;gap:10px;align-items:flex-start}
.exn{font-family:var(--display);font-size:20px;color:var(--gold);min-width:22px;line-height:1.1}
.exh h3{font-size:19px;line-height:1.15;text-transform:none;letter-spacing:.01em;display:block}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:11px;font-weight:600;letter-spacing:.06em;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:2px 6px}
.tagnote{font-size:12px;color:var(--muted);margin-top:4px}
.trend{margin-left:auto;flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid var(--same);color:var(--same);white-space:nowrap}
.trend.up,.pc.up{border-color:var(--up);color:var(--up)}
.trend.down,.pc.down{border-color:var(--down);color:var(--down)}
.prev{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.prev button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:12px;flex:none;min-height:30px}
.srow{display:grid;grid-template-columns:34px 1fr 14px 1fr 54px;gap:8px;align-items:center;margin-top:8px}
.srow .s{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.srow .x{color:var(--muted);text-align:center}
.srow input{text-align:center;font-size:18px;font-weight:600;padding:8px 4px;font-variant-numeric:tabular-nums}
.tagbtn{border:1px dashed var(--line);background:transparent;border-radius:10px;min-height:44px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tagbtn.on{border:1px solid var(--gold);color:var(--gold);background:transparent}
.tagbtn.plan:not(.on){border-color:var(--gold)}
.sw{margin-top:10px}
.sw .srow{margin-top:0}
.lastl{font-size:12px;color:var(--muted);margin:4px 0 0 42px;display:flex;flex-wrap:wrap;gap:2px 12px}
.lastl b{color:var(--fg);font-weight:600}
.lastl .tgt{color:var(--gold);font-weight:600}
.srow input.up{border-color:var(--up);color:var(--up);background:color-mix(in srgb,var(--up) 14%,var(--bg))}
.srow input.down{border-color:var(--down);color:var(--down);background:color-mix(in srgb,var(--down) 14%,var(--bg))}
.sbtns button.union{border-color:var(--gold);color:var(--gold)}
.macs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.macs div{background:var(--surface2);border-radius:10px;padding:9px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.macs b{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.macs span{font-size:11px;color:var(--muted)}
.mline{margin-top:6px;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.manual{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.manual label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.manual input{padding:8px 4px;text-align:center;min-height:42px}
.linkbtn{background:none;border:0;color:var(--gold);padding:8px 0;font-size:14px;text-decoration:underline;min-height:40px}
.editor{margin-top:4px;border-top:1px solid var(--line);padding-top:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 76px 12px 40px 40px;gap:6px;align-items:center;margin-top:8px}
.irow .in{font-size:15px;min-width:0;overflow-wrap:anywhere}
.irow input{padding:8px 4px;text-align:center;min-height:42px}
.irow.add{grid-template-columns:minmax(0,1fr) 70px auto}
.sq2{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-height:42px;font-size:16px}
.mvbox{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--surface2);border-radius:10px;padding:10px;margin-top:6px}
.mvbox label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.mvbox input{width:90px}.mvbox select{width:auto;min-width:130px}
.badge.ap{border-color:var(--muted);color:var(--muted)}
.irow3{display:flex;align-items:center;gap:8px}
.irow3 .exn{flex:1}
.manual3{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
.manual3 label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.manual3 input{padding:8px;min-height:42px}
.optbox{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px}
.optbox>.irow3 b{flex:1;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.rest[hidden]{display:none!important}
input[data-pk]{cursor:pointer;caret-color:transparent}
.pk{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.pk[hidden]{display:none!important}
.pks{width:100%;max-width:560px;background:var(--surface,#fff);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.pkt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:2px}
.pkh{font-size:13px;color:var(--muted);margin-bottom:10px}
.pkw{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.pkc{text-align:center;font-size:13px;color:var(--muted)}
.wheel{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:88px 0;background:var(--surface2,#f0ece4);border-radius:12px;scrollbar-width:none;touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wi.sel{color:var(--fg);font-size:28px}
.wi{height:44px;line-height:44px;text-align:center;font-size:24px;font-weight:600;scroll-snap-align:center;color:var(--muted)}
.pkband{position:absolute;left:0;right:0;top:88px;height:44px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);pointer-events:none;border-radius:6px}
.pkbtns{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:14px}
.rest{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:flex;justify-content:flex-end}
.rest.run{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.rest.run.ok{border-color:var(--up)}
.restbtn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:700;min-height:46px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.rt{display:flex;align-items:center;gap:12px}
.rtime{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.rest.ok .rtime{color:var(--up)}
.rbar{flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;min-width:40px}
.rbar i{display:block;height:100%;width:0;background:var(--gold)}
.rest.ok .rbar i{background:var(--up)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rchips .chip{padding:5px 10px;min-height:34px;font-size:13px}
.prb{display:inline-block;background:var(--gold);color:var(--gold-ink);font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;vertical-align:middle;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mf{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.mf input{padding:9px 10px}
.sess{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sess .btn{width:auto;padding:11px 18px;flex:none}
.clock{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--gold)}
.slist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.slist:first-of-type{border-top:0}
.sbtns{display:flex;gap:8px;margin-top:10px}
.sbtns button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 6px;font-size:14px;min-height:40px}
.legend{font-size:13px;color:var(--muted)}
.legend b{color:var(--gold);font-weight:600}
/* calendario */
.cal{display:grid;grid-template-columns:30px repeat(7,1fr);gap:5px;margin-top:10px}
.cal .h{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;letter-spacing:.06em}
.cal .wk{font-size:11px;color:var(--muted);display:grid;place-items:center;font-family:var(--display);letter-spacing:.04em}
.cell{aspect-ratio:1/1.05;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0 7px;min-width:0}
.cell .n{font-family:var(--display);font-size:18px;font-weight:700;line-height:1}
.cell.out{opacity:.35}
.cell.today{border-color:var(--gold)}
.cell.sel{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.cell.sel .dot{border-color:var(--gold-ink)}
.cell.sel .dot.on,.cell.sel .dot.part{background:var(--gold-ink)}
.mnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mnav h2{font-size:26px;text-transform:capitalize}
.sq{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
/* progreso */
.sumbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin:10px 0 8px}
.sumbar i{display:block;height:100%}
.sumleg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.sumleg b{font-family:var(--display);font-size:22px;margin-right:4px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.pcs{display:flex;gap:6px;grid-column:1/-1}
.pc{font-size:13px;font-weight:600;border:1px solid var(--same);color:var(--same);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.spark{width:64px;height:24px;color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:92px;margin-top:10px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--gold);border-radius:5px 5px 2px 2px;min-height:3px}
.bar i.z{background:var(--surface2)}
/* semana */
.field{margin-top:14px}
.field label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.field label output{font-family:var(--display);font-size:20px;color:var(--gold);line-height:1}
.field.unset label output{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold);height:32px}
.field.unset input[type=range]{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;letter-spacing:.04em;padding:6px 0;min-height:52px;text-transform:uppercase}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{color:var(--muted);text-align:center;padding:18px 0}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.check,.tagbtn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div id="app"><div class="top"><div><h1>Diario de Entreno</h1><div class="sub">Cargando tu plan…</div></div></div></div>
<nav id="nav"></nav>
<div id="rest" class="rest" hidden></div>
<div id="pick" class="pk" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============ PLAN (de tu PDF) ============ */
const TAGS={DS:['Drop set','Serie descendente: baja el peso y sigue sin descanso'],TS:['Top set','Serie pesada'],BO:['Back off set','Serie con máximo control reduciendo un poco la carga'],SS:['Superserie','Dos ejercicios seguidos sin descanso']};
const E=(id,name,sets,reps,hold,o)=>Object.assign({id,name,sets,reps,hold:hold||'',tags:{},setReps:{},ss:null,note:''},o||{});
let DAYS={

  const pts=vals.map((x,i)=>x==null?null:[2+i*(w-4)/(n-1),mx===mn?hh/2:hh-3-(x-mn)/(mx-mn)*(hh-6)]).filter(Boolean);
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" aria-hidden="true"><polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.6" fill="currentColor"/></svg>`;

function setStr(sets){
  const out=[];
  (sets||[]).forEach(s=>{
    const r=String(s.r||'').trim(),k=String(s.k||'').trim();if(!r&&!k)return;
    let b=(r||'?')+(k?'x'+k.replace('.',',')+'kg':'');
    if(s.t==='DS'&&out.length){out[out.length-1]+=' + DS '+b}
    else out.push(b+(s.t&&s.t!=='DS'?' ('+s.t+')':''));
  });
  return out;
}
const CG='FF1F8A4C',CR='FFC63D33';
function setRuns(sets,prev){
  const cells=[];
  (sets||[]).forEach((s,i)=>{
    const r=String(s.r||'').trim(),k=String(s.k||'').trim();if(!r&&!k)return;
    const ps=prev&&prev[i];let tr=null,tk=null;
    const tn=(a,b)=>a>b?'up':a<b?'down':'same';
    if(ps&&(num(ps.r)||num(ps.k))){tr=r?tn(num(r),num(ps.r)):null;tk=k?tn(num(k),num(ps.k)):null}
    const run=(t,st)=>({text:t,font:{name:'Aptos Narrow',size:10,bold:st==='up'||st==='down',color:{argb:st==='up'?CG:st==='down'?CR:'FF000000'}}});
    const parts=[run(r||'?',tr)];
    if(k)parts.push(run('x',null),run(k.replace('.',',')+'kg',tk));
    if(s.t&&s.t!=='DS')parts.push(run(' ('+s.t+')',null));
    if(s.t==='DS'&&cells.length)cells[cells.length-1].push(run(' + DS ',null),...parts);
    else cells.push(parts);
  });
  return cells;
}
function buildWorkbookX(meso){

  const OR={type:'pattern',pattern:'solid',fgColor:{argb:'FFFF9F00'}};
  const WH={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFFFF'}};
  const th={style:'thin',color:{argb:'FF000000'}};
  const BD={top:th,left:th,bottom:th,right:th};
  const ws=wb.addWorksheet('Progresión_de_entrenamiento');
  const maxEx=Math.max(8,...Object.values(DAYS).map(d=>d.ex.length)),dayH=maxEx+2,bandH=1+5*dayH+1;
  for(let c=0;c<32;c++)ws.getColumn(c+1).width=c%8===0?48:15;
  const cell=(r,c)=>ws.getCell(r+1,c+1);
  const head=(r,c,v)=>{const x=cell(r,c);x.value=v;x.fill=OR;x.border=BD;x.font={name:'Poppins',size:8,color:{argb:'FF000000'}}};
  for(let bi=0;bi<8;bi++){
    const W=(meso-cfg().meso)*8+bi;const c0=(bi%4)*8,r0=Math.floor(bi/4)*bandH;
    head(r0,c0,'SEMANA '+(bi+1));for(let s=1;s<=7;s++)head(r0,c0+s,null);
    for(let dn=1;dn<=5;dn++){
      const r=r0+1+(dn-1)*dayH;
      head(r,c0,'DÍA '+dn+' (EJERCICIO)');for(let s=1;s<=7;s++)head(r,c0+s,'SERIE '+s);
      DAYS[dn].ex.forEach((ex,i)=>{
        const nm=cell(r+1+i,c0);nm.value=ex.name;nm.font={name:'Aptos Narrow',size:11};
        const arr=setRuns(weekSets(ex.id,W),weekSets(ex.id,W-1));
        for(let j=0;j<7;j++){const x=cell(r+1+i,c0+1+j);x.border=BD;x.font={name:'Aptos Narrow',size:10};x.alignment={horizontal:'center',vertical:'middle',wrapText:true};if(arr[j])x.value={richText:arr[j]}}

  const hc=(r,c,v,sz,fill)=>{const x=w2.getCell(r,c);x.value=v;x.fill=fill;x.border=BD;x.font={name:'Poppins',size:sz};x.alignment={horizontal:'center',vertical:'middle',wrapText:true}};

    for(let i=0;i<8;i++){const k=['agujetas','motivacion','rendimiento','fatiga','estres','hambre','horas','calidad'][i];w2.getCell(r,3+i).dataValidation={type:'list',allowBlank:true,formulae:['"'+WOPT[k].join(',')+'"']}}
  }

  const w3=wb.addWorksheet('Resumen_progresión');

  const fl=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
  const GF=fl('FFE2F3E8'),RF=fl('FFFBE3E0'),AF=fl('FFFFF1CC');
  w3.getCell(1,1).value='Comparado con la semana anterior. Kilos = peso máximo de la semana · Reps = repeticiones medias por serie · Progreso = qué ha subido o bajado.';
  w3.getCell(1,1).font={name:'Poppins',size:9};
  w3.getCell(2,1).value='Verde = sube · Rojo = baja · Amarillo = unos suben y otros bajan · Sin color = igual.';
  w3.getCell(2,1).font={name:'Poppins',size:9};
  const h3=(r,c,v)=>{const x=w3.getCell(r,c);x.value=v;x.fill=OR;x.border=BD;x.font={name:'Poppins',size:9};x.alignment={horizontal:'center',vertical:'middle'}};

  const put=(r,c,txt,sc)=>{const x=w3.getCell(r,c);x.value=txt;x.border=BD;x.font={name:'Aptos Narrow',size:10,bold:!!sc,color:{argb:sc===1?CG:sc===-1?CR:sc===2?'FF8A5A00':'FF000000'}};x.alignment={horizontal:'center',vertical:'middle',wrapText:true};if(sc===1)x.fill=GF;else if(sc===-1)x.fill=RF;else if(sc===2)x.fill=AF};

    let t='';if(up.length)t+='▲ Suben '+up.join(' y ');

  let rr=6;

      for(let bi=0;bi<8;bi++){
        const c=2+bi*3;
        const W=(meso-cfg().meso)*8+bi;const cur=setsStat(weekSets(ex.id,W)),pv=setsStat(weekSets(ex.id,W-1));
        if(!cur){put(rr,c,null,0);put(rr,c+1,null,0);put(rr,c+2,null,0);continue}
        const av=Math.round(cur.av*10)/10;
        const dk=pv?cur.mk-pv.mk:0,dr=pv?Math.round((cur.av-pv.av)*10)/10:0;
        put(rr,c,cur.mk?fmtN(cur.mk)+' kg'+(pv&&(cur.mk||pv.mk)?dl(dk):''):'—',sg(dk));
        put(rr,c+1,fmtN(av)+(pv?dl(dr):''),sg(dr));
        if(pv){const v=verdict(dk,dr);put(rr,c+2,v[0],v[1])}else put(rr,c+2,null,0);
      }
      rr++;
    });
  }
  return wb;
}

function medCell(row,m){

  if(row==='peso'){const p=v('peso');return p&&/^[\d.,]+$/.test(p)?p+' kg':p}

function wSetCell(doc,tc,text){
  const kids=(el,n)=>Array.from(el.childNodes).filter(c=>c.localName===n&&c.namespaceURI===WNS);
  const ps=kids(tc,'p');const p=ps[0];if(!p)return;
  ps.slice(1).forEach(x=>tc.removeChild(x));
  kids(p,'r').forEach(x=>p.removeChild(x));
  if(!text)return;
  const r=doc.createElementNS(WNS,'w:r'),rpr=doc.createElementNS(WNS,'w:rPr');
  ['w:sz','w:szCs'].forEach(t=>{const e=doc.createElementNS(WNS,t);e.setAttributeNS(WNS,'w:val','18');rpr.appendChild(e)});
  r.appendChild(rpr);
  text.split('\n').forEach((line,i)=>{if(i)r.appendChild(doc.createElementNS(WNS,'w:br'));const t=doc.createElementNS(WNS,'w:t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=line;r.appendChild(t)});
  p.appendChild(r);

async function buildWord(){
  const zip=await JSZip.loadAsync(WORD_TPL,{base64:true});
  const xml=await zip.file('word/document.xml').async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const kids=(el,n)=>Array.from(el.childNodes).filter(c=>c.localName===n&&c.namespaceURI===WNS);
  const tbl=doc.getElementsByTagNameNS(WNS,'tbl')[0];
  const rows=kids(tbl,'tr');
  const b0=Math.floor(Math.max(0,weekIdx(S.ui.date))/12)*12;
  if(b0>0){const hc=kids(rows[0],'tc');for(let i=0;i<12;i++)if(hc[1+i])wSetCell(doc,hc[1+i],'SEMANA '+(b0+i+1))}
  const keys=['peso','cintura','cadera','pecho','hombro','bi','cu','ge','gluteo'];
  keys.forEach((k,ri)=>{
    const cells=kids(rows[ri+1],'tc');
    for(let i=0;i<12;i++){const m=(S.weeks[b0+i]||{}).med;if(cells[1+i])wSetCell(doc,cells[1+i],m?medCell(k,m):'')}
  });
  let out=new XMLSerializer().serializeToString(doc);
  if(!out.startsWith('<?xml'))out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+out;
  zip.file('word/document.xml',out);
  return zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'});
}

  else if(p[0]==='pe'){peInput(p,el)}
  else if(p[0]==='med'){const W=weekIdx(date);const w=S.weeks[W]=S.weeks[W]||{};(w.med=w.med||{})[p[1]]=el.value;touch('week_'+W)}
  else if(p[0]==='cfg'){const k=p[1];if(k==='xname'||k==='wname'){S.cfg={...cfg(),[k]:el.value};touch('cfg');const pv=document.getElementById(k==='xname'?'xprev':'wprev');if(pv)pv.innerHTML='Se guardará como: <b>'+esc(nameFor(el.value||(k==='xname'?XDEF:WDEF),curN()))+(k==='xname'?'.xlsx':'.docx')+'</b>'}}
  else if(p[0]==='itm'){const e=ensureItems(p[1],date);e.items[+p[2]].g=el.value;touch('day_'+date);liveMac(p[1],date)}
  else if(p[0]==='food'){const o=foodObj(p[1]);if(!o)return;const cur=S.foods[p[1]]||{n:o.n,k:o.k,p:o.p,c:o.c,f:o.f};const n={...cur,v:1};n[p[2]]=el.value;S.foods=S.foods||{};S.foods[p[1]]=n;touch('foods')}
  else if(p[0]==='fsearch'){const q=el.value.trim().toLowerCase();document.querySelectorAll('[data-fn]').forEach(c=>{c.hidden=q&&!c.dataset.fn.includes(q)})}
  else if(p[0]==='mac'){const m=D(date).meals;(m[p[1]]=m[p[1]]||{})[p[2]]=el.value;touch('day_'+date);const ms=document.getElementById('macsum');if(ms)ms.innerHTML=macSummary(date)}
  else if(p[0]==='w'){const W=weekIdx(date);const w=S.weeks[W]=S.weeks[W]||{};
    w[p[1]]=el.value;
    touch('week_'+W)}
});
document.addEventListener('change',e=>{
  const el=e.target;const f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==='bkfile'){const file=el.files&&el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const b=JSON.parse(rd.result);if(!b||typeof b!=='object'||!b.days)throw 0;S.ui.restore={raw:b,nd:Object.keys(b.days||{}).length,nw:Object.keys(b.weeks||{}).length};render()}catch(x){toast('Ese archivo no es una copia válida')}};rd.readAsText(file);return}
  if(f.startsWith('set:')){const q=f.split(':');const st=((S.days[S.ui.date]||{}).sets||{})[q[1]];const row=st&&st[+q[2]];if(row&&String(row.r||'')!==''&&String(row.k||'')!==''&&cfg().restAuto!==false)startRest();return}
  if(f==='exmeso'){S.ui.exmeso=+el.value;return}
  if(/^pe:ex:[^:]+:(sets|ss)$/.test(f)){render();return}
  if(f==='cfg:start'&&el.value){S.cfg={...cfg(),start:mondayOf(el.value)};touch('cfg');render()}
  if(f==='cfg:meso'&&+el.value>0){S.cfg={...cfg(),meso:Math.floor(+el.value)};touch('cfg');render()}
});
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
